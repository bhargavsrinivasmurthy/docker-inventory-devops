{% extends "base.html" %}
{% block title %}Add product{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Add product</h1>

<form method="post" class="card card-body">
  <div class="row g-3">
    <div class="col-md-4">
      <label class="form-label" for="sku">SKU</label>
      <input class="form-control" id="sku" name="sku" required>
    </div>
    <div class="col-md-8">
      <label class="form-label" for="name">Name</label>
      <input class="form-control" id="name" name="name" required>
    </div>
    <div class="col-md-4">
      <label class="form-label" for="category">Category</label>
      <input class="form-control" id="category" name="category">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="unit_cost">Unit cost</label>
      <input class="form-control" id="unit_cost" name="unit_cost" type="number" step="0.01" min="0" value="0">
    </div>
    <div class="col-md-4">
      <label class="form-label" for="selling_price">Selling price</label>
      <input class="form-control" id="selling_price" name="selling_price" type="number" step="0.01" min="0" value="0">
    </div>
    <div class="col-md-6">
      <label class="form-label" for="quantity">Opening quantity</label>
      <input class="form-control" id="quantity" name="quantity" type="number" min="0" value="0">
    </div>
    <div class="col-md-6">
      <label class="form-label" for="low_stock_threshold">Low-stock threshold</label>
      <input class="form-control" id="low_stock_threshold" name="low_stock_threshold" type="number" min="0" value="5">
    </div>
  </div>
  <div class="mt-3">
    <button class="btn btn-primary" type="submit">Save product</button>
    <a class="btn btn-link" href="{{ url_for('main.products') }}">Cancel</a>
  </div>
</form>
{% endblock %}
